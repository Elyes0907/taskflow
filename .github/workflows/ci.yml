name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
 
  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
          
      - name: Installer, tester, construire
        run: |
          npm ci
          npm test
          npm run build